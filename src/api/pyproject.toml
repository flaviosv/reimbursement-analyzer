[project]
name = "api"
version = "0.1.0"
description = "ReimbursementAnalyzer test - API Layer"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "shared",
    "uvicorn[standard]>=0.52.1",
]

# Installed only by the Dockerfile's migrate stage, so the request-serving
# image carries neither the DDL tooling nor psycopg[binary]'s vendored
# libssl/libpq, which a base-image rebuild would never patch.
[project.optional-dependencies]
migrations = [
    "psycopg[binary]>=3.3.4",
    "yoyo-migrations>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "confluent-kafka>=2.15.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "shared",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

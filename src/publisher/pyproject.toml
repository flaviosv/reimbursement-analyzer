[project]
name = "publisher"
version = "0.1.0"
description = "ReimbursementAnalyzer test - Publisher Layer"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "python-dotenv>=1.2.2",
    "shared",
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# src/publisher/src holds publisher's own modules directly (no wrapping
# package directory) — package-dir maps the "publisher" import name onto
# that directory.
[tool.setuptools.package-dir]
publisher = "src"

[tool.uv.sources]
shared = { workspace = true }

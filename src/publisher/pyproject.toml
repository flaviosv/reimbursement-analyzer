[project]
name = "publisher"
version = "0.1.0"
description = "ReimbursementAnalyzer test - Publisher Layer"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "python-dotenv>=1.2.2",
    "shared",
    "watchfiles>=1.2.0",
]

[tool.uv]
# No [build-system]: publisher's own modules sit directly in
# src/publisher/src (no wrapping package directory uv_build could build a
# wheel around) — a virtual, non-installed workspace member, like api
# (AD-018/AD-026). Its dependencies still resolve into the shared venv;
# publisher itself runs straight from source via PYTHONPATH (see Dockerfile),
# not an installed import.
package = false

[tool.uv.sources]
shared = { workspace = true }

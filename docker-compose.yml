# Local development stack: app Postgres, Kafka (KRaft, single node), the LangFuse
# observability stack (its own postgres/clickhouse/redis/minio, per its official
# docker-compose.yml), and the 3 uv-workspace services (api, agent, publisher).
#
# Credentials below are dev-only placeholders (see .env.sample) — replace
# them before this is ever used outside a local machine.

x-langfuse-infra-depends-on: &langfuse-infra-depends-on
  langfuse-postgres:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy

services:
  # --- App's own data store (Reimbursement / Human Review) ---
  postgres:
    image: postgres:18
    container_name: reimbursementanalyzer-flavio-postgres
    restart: always
    environment:
      POSTGRES_USER: reimbursementanalyzer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reimbursementanalyzer
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimbursementanalyzer"]
      interval: 3s
      timeout: 3s
      retries: 10

  # --- Kafka: single-node KRaft (no ZooKeeper) ---
  kafka:
    image: apache/kafka:4.3.1
    container_name: reimbursementanalyzer-flavio-kafka
    hostname: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --- LangFuse (v4) and its own dependencies, per its official docker-compose.yml ---
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:4
    container_name: reimbursementanalyzer-flavio-langfuse-worker
    restart: always
    depends_on:
      <<: *langfuse-infra-depends-on
      langfuse-migration-gate:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:3030:3030
    environment: &langfuse-worker-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_AUTH: ${REDIS_AUTH}

  langfuse-web:
    image: docker.io/langfuse/langfuse:4
    container_name: reimbursementanalyzer-flavio-langfuse-web
    restart: always
    depends_on: *langfuse-infra-depends-on
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-worker-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_INIT_ORG_ID: reimbursementanalyzer
      LANGFUSE_INIT_ORG_NAME: ReimbursementAnalyzer
      LANGFUSE_INIT_PROJECT_ID: reimbursement-agent
      LANGFUSE_INIT_PROJECT_NAME: Reimbursement Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@reimbursementanalyzer.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}

  langfuse-migration-gate:
    image: docker.io/postgres:17
    container_name: reimbursementanalyzer-flavio-langfuse-migration-gate
    depends_on:
      langfuse-web:
        condition: service_started
      langfuse-postgres:
        condition: service_healthy
    environment:
      LANGFUSE_DATABASE_URL: ${LANGFUSE_DATABASE_URL}
    entrypoint: sh
    command: >
      -c '
      i=0;
      until [ "$$(psql "$$LANGFUSE_DATABASE_URL" -tAc "SELECT CASE WHEN COUNT(*) > 0 AND COUNT(*) FILTER (WHERE finished_at IS NULL) = 0 THEN 1 ELSE 0 END FROM _prisma_migrations" 2>/dev/null)" = "1" ]; do
        i=$$((i+1));
        if [ "$$i" -ge 60 ]; then echo "timed out waiting for langfuse-web migrations"; exit 1; fi;
        echo "waiting for langfuse-web migrations to complete... ($$i/60)";
        sleep 2;
      done;
      echo "migrations complete"
      '

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    container_name: reimbursementanalyzer-flavio-langfuse-clickhouse
    restart: always
    user: "101:101"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: reimbursementanalyzer-flavio-langfuse-minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9090:9000"
      - 127.0.0.1:9091:9001
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

  langfuse-redis:
    image: docker.io/redis:7
    container_name: reimbursementanalyzer-flavio-langfuse-redis
    restart: always
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory-policy noeviction
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  langfuse-postgres:
    image: docker.io/postgres:17
    container_name: reimbursementanalyzer-flavio-langfuse-postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    environment:
      POSTGRES_PASSWORD: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data

  # --- The 3 uv-workspace services ---
  api:
    build:
      context: .
      dockerfile: src/api/Dockerfile
    container_name: reimbursementanalyzer-flavio-api
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - ./src:/app/src

  agent:
    build:
      context: .
      dockerfile: src/agent/Dockerfile
    container_name: reimbursementanalyzer-flavio-agent
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: postgresql://reimbursementanalyzer:${POSTGRES_PASSWORD}@postgres:5432/reimbursementanalyzer
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
    volumes:
      - ./src:/app/src

  publisher:
    build:
      context: .
      dockerfile: src/publisher/Dockerfile
    container_name: reimbursementanalyzer-flavio-publisher
    restart: always
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_URL: postgresql://reimbursementanalyzer:${POSTGRES_PASSWORD}@postgres:5432/reimbursementanalyzer
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
    driver: local
  langfuse_postgres_data:
    driver: local
  langfuse_clickhouse_data:
    driver: local
  langfuse_clickhouse_logs:
    driver: local
  langfuse_minio_data:
    driver: local
  langfuse_redis_data:
    driver: local

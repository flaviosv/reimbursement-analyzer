[project]
name = "shared"
version = "0.1.0"
description = "ReimbursementAnalyzer test - Shared kernel"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "ecs-logging>=2.3.0",
    # [email] pulls email-validator, which EmailStr requires at import time.
    "pydantic[email]>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

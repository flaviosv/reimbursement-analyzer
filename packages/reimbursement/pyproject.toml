[project]
name = "reimbursement"
version = "0.1.0"
description = "ReimbursementAnalyzer test - Reimbursement Agent Layer"
authors = [
    { name = "Flavio Studart", email = "flaviostudart@gmail.com" }
]
requires-python = ">=3.14.7"
dependencies = [
    "asyncpg>=0.31.0",
    "confluent-kafka>=2.15.0",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "langfuse>=4.14.3",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "shared",
    "watchfiles>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

[project]
name = "reimbursementanalyzer"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = []

[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = [
    # The suite drives the migration runner, so it needs api's schema tooling
    # even though the request-serving image does not ship it.
    "api[migrations]",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[kafka,postgres]>=4.15.0",
]

[tool.uv.sources]
api = { workspace = true }

[tool.pytest.ini_options]
# The whole workspace, not one member: naming a single package here means a
# tests directory added to agent or publisher is silently never collected.
testpaths = ["src"]
python_classes = ["Describe*"]
python_functions = ["it_*"]
# Sibling feature slices (src/api/tests/reimbursement/<op>/) reuse filenames
# like test_route.py; default import-mode collides on the module name, and
# without pythonpath each nested test file's own dir — not src/api/tests —
# lands on sys.path, breaking `from helpers import ...`.
# src/api/src and src/publisher/src are those services' own module roots:
# both are virtual (uninstalled) workspace members (see their pyproject.toml
# files), so their modules are only importable via these explicit paths, not
# via a normal package install. Both sit on one sys.path and expose bare
# module names, so publisher's must stay clear of api's
# {dependencies, errors, main, migrate} — AD-026.
# src/agent/tests (but not src/agent/src) is on this list for the same
# `from fakes import ...` reason as publisher's tests dir — agent itself
# stays a real installable package (deliberately not flattened, to avoid
# exactly the AD-026 collision risk above), so agent.consumer/agent.validation
# are importable via the normal package install and need no path entry.
pythonpath = [
    "src/api/tests",
    "src/api/src",
    "src/publisher/tests",
    "src/publisher/src",
    "src/agent/tests",
]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires a container beyond the suite's own Postgres default",
]

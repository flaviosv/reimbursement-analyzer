[project]
name = "reimbursementanalyzer"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = []

[tool.uv.workspace]
members = ["src/*"]

[dependency-groups]
dev = [
    # The suite drives the migration runner, so it needs api's schema tooling
    # even though the request-serving image does not ship it.
    "api[migrations]",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[kafka,postgres]>=4.15.0",
]

[tool.uv.sources]
api = { workspace = true }

[tool.pytest.ini_options]
# api, publisher, shared — not the whole workspace: naming each explicitly
# means a tests directory added to either is never silently uncollected, the
# same reasoning the old single "src" entry had. reimbursement is NOT listed
# here on purpose: it has its own, standalone src/reimbursement/pyproject.toml
# [tool.pytest.ini_options] instead (run as its own `pytest src/reimbursement`
# invocation) — its flat module names (config, consumer) collide with
# publisher's flat module names of the same names, and both packages keep
# plain, unprefixed filenames, so the only fix is never sharing one sys.path
# between them (AD-026 flagged the risk; AD-030 records this resolution).
testpaths = ["src/api", "src/publisher", "src/shared"]
python_classes = ["Describe*"]
python_functions = ["it_*"]
# Sibling feature slices (src/api/tests/reimbursement/<op>/) reuse filenames
# like test_route.py; default import-mode collides on the module name, and
# without pythonpath each nested test file's own dir — not src/api/tests —
# lands on sys.path, breaking `from helpers import ...`.
# api is a real installed package now (setuptools + package-dir), so its own
# module root no longer needs a pythonpath entry — only its tests dir does,
# for the same bare-name `from helpers import ...` reason above.
# src/publisher/src is still a virtual (uninstalled) workspace member (see
# its pyproject.toml), so its modules are only importable via this explicit
# path, not via a normal package install. It sits on the same sys.path as
# every other pythonpath entry here, so publisher's {config, consumer,
# processing} must stay clear of any other bare module name on this list —
# AD-026.
pythonpath = [
    "src/api/tests",
    "src/publisher/tests",
    "src/publisher/src",
]
addopts = "--import-mode=importlib"
markers = [
    "integration: requires a container beyond the suite's own Postgres default",
]

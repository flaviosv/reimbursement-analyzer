[project]
name = "reimbursementanalyzer"
version = "0.1.0"
requires-python = ">=3.14.7"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    # The suite drives the migration runner, so it needs api's schema tooling
    # even though the request-serving image does not ship it.
    "api[migrations]",
    # Real installed packages (setuptools + package-dir) now — nothing else
    # in the graph depends on them, so without this a bare `uv sync`/
    # `uv run pytest` never installs them and their dotted imports 404.
    "publisher",
    "reimbursement",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "testcontainers[kafka,postgres]>=4.15.0",
    "pylint>=4.0.6",
]

[tool.uv.sources]
api = { workspace = true }
publisher = { workspace = true }
reimbursement = { workspace = true }

[tool.pytest.ini_options]
# api, publisher, reimbursement, shared — the whole workspace, named
# explicitly so a tests directory added to any of them is never silently
# uncollected. reimbursement no longer needs its own standalone
# packages/reimbursement/pyproject.toml [tool.pytest.ini_options] (AD-026 flagged
# the risk; AD-031 records this resolution, amended to uv_build): all three
# services are real, dotted-namespaced packages now (uv_build, nested
# src-layout), so publisher.config/reimbursement.config etc. no longer
# collide on a shared bare module name the way flat config.py/consumer.py did.
testpaths = ["packages/api", "packages/publisher", "packages/reimbursement", "packages/shared", "tests/e2e"]
python_classes = ["Describe*"]
python_functions = ["it_*"]
# Sibling feature slices (packages/api/tests/reimbursement/<op>/) reuse
# filenames like test_route.py; default import-mode collides on the module
# name, and without pythonpath each nested test file's own dir — not
# packages/api/tests — lands on sys.path, breaking `from helpers import ...`.
# api, publisher, and reimbursement are all real installed packages now
# (uv_build, nested src-layout), so none needs its own module root on this
# list — only each package's tests dir does, for the same bare-name
# `from helpers/fakes/agent_fakes import ...` reason above.
pythonpath = [
    "packages/api/tests",
    "packages/publisher/tests",
    "packages/reimbursement/tests",
]
addopts = "--import-mode=importlib -m \"not e2e\""
markers = [
    "integration: requires a container beyond the suite's own Postgres default",
    "e2e: requires a live docker-compose stack and a real GROQ_API_KEY",
]
